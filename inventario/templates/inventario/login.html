<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Boccherini</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'boccherini-blue': '#0A192F',
                        'boccherini-gold': '#cda043',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Fondo elegante ajustado al nuevo azul corporativo */
        .gradient-bg {
            background: radial-gradient(circle at top right, #112A46 0%, #0A192F 50%, #040B16 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden transform transition-all border border-slate-800/50">
        
        <!-- Cabecera de Marca -->
        <div class="bg-slate-50 px-8 py-10 text-center relative border-b border-slate-200">
            <!-- Logo Oficial -->
            <div class="bg-white p-3 rounded-2xl shadow-sm inline-flex items-center justify-center mb-5 border border-slate-200 relative z-10">
                <img class="h-14 w-auto object-contain" src="https://boccherinicol.vtexassets.com/assets/vtex.file-manager-graphql/images/117104a7-a9bf-4a1c-ba2b-c33ac4db466e___dc9a4962633b58475c7995a25825a981.jpg" alt="Logo Boccherini">
            </div>
            
            <h1 class="text-boccherini-blue text-2xl font-black tracking-tight uppercase">Sistema de Inventario</h1>
            <span class="text-boccherini-gold text-xs font-extrabold tracking-[0.2em] uppercase block mt-1.5">
                Acceso Corporativo
            </span>
            
            <!-- Brillo decorativo de fondo -->
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-boccherini-blue via-boccherini-gold to-boccherini-blue"></div>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="p-8">
            <p class="text-slate-500 text-sm text-center mb-6 font-medium">Ingrese sus credenciales para acceder a los módulos de la bodega.</p>

            <!-- Manejo de Errores de Django estilizado -->
            {% if form.errors %}
            <div class="mb-6 bg-rose-50 border-l-4 border-rose-600 p-4 rounded-r-lg shadow-sm">
                <div class="flex items-center space-x-3">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-600"></i>
                    <p class="text-xs text-rose-800 font-bold">Usuario o contraseña incorrectos. Intente nuevamente.</p>
                </div>
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}

                <!-- Campo: Usuario / Cédula -->
                <div>
                    <label for="id_username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Nombre de Usuario
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" name="username" id="id_username" required
                               placeholder="Ej: admin o 10204567"
                               class="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-[#2563EB] text-sm transition-all text-slate-800 shadow-sm" autocomplete="off">
                    </div>
                </div>

                <!-- Campo: Contraseña -->
                <div>
                    <label for="id_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Contraseña
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i data-lucide="key-round" class="w-4 h-4"></i>
                        </span>
                        <input type="password" name="password" id="id_password" required
                               placeholder="••••••••"
                               class="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-[#2563EB] text-sm transition-all text-slate-800 shadow-sm">
                    </div>
                </div>

                <!-- Botón de Ingreso -->
                <button type="submit" 
                        class="w-full bg-[#2563EB] text-white font-bold py-3.5 px-4 rounded-xl shadow-md hover:bg-blue-700 transform active:scale-[0.98] transition-all text-sm uppercase tracking-wider cursor-pointer mt-6 flex items-center justify-center gap-2">
                    Ingresar al Sistema <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>

        <!-- Footer Corporativo -->
        <div class="bg-slate-50 px-8 py-5 text-center border-t border-slate-200">
            <p class="text-[10px] text-slate-400 font-semibold tracking-wide">
                &copy; 2026 Boccherini S.A.S. &bull; Módulo Protegido.
            </p>
        </div>
    </div>

    <!-- Inicializar iconos -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

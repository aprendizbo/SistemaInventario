{% extends 'inventario/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    
    <!-- CONTENEDOR PRINCIPAL -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        
        <!-- ENCABEZADO -->
        <div class="bg-[#0A192F] px-6 py-6 text-center border-b border-slate-700">
            <div class="w-12 h-12 bg-blue-900/50 rounded-full flex items-center justify-center mx-auto mb-3 border border-blue-800">
                <i data-lucide="file-spreadsheet" class="w-6 h-6 text-emerald-400"></i>
            </div>
            <h2 class="text-xl font-bold text-white tracking-wide">Importar Maestro de Productos</h2>
        </div>

        <div class="p-6 sm:p-8">
            <p class="text-sm text-slate-500 text-center mb-8 leading-relaxed max-w-md mx-auto">
                Sube el archivo en formato Excel (.xlsx, .xls) con la estructura requerida para actualizar el sistema de inventario.
            </p>

            <form method="POST" enctype="multipart/form-data" class="m-0">
                {% csrf_token %}
                
                <!-- ÁREA DE CARGA DE ARCHIVO (DROP AREA) -->
                <div class="relative flex flex-col items-center justify-center w-full p-10 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 hover:bg-blue-50/50 hover:border-[#2563EB] transition-colors cursor-pointer group">
                    
                    <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-300 mb-3 group-hover:text-[#2563EB] transition-colors"></i>
                    
                    <span class="bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold text-xs mb-2 shadow-sm group-hover:border-blue-200 transition-colors">
                        Explorar archivos
                    </span>
                    
                    <span class="text-xs font-medium text-slate-500" id="file-name">
                        o arrastra tu documento aquí
                    </span>
                    
                    <!-- Input real oculto -->
                    <input class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file" name="archivo_excel" accept=".xlsx, .xls" required 
                           onchange="document.getElementById('file-name').innerHTML = `<strong class='text-[#2563EB]'>Archivo seleccionado:</strong> ${this.files[0].name}`">
                </div>

                <!-- BOTÓN DE ENVÍO -->
                <button type="submit" class="w-full bg-[#2563EB] hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl text-sm transition-colors shadow-sm mt-6 flex items-center justify-center gap-2 border-0 cursor-pointer">
                    Subir y Procesar Archivo <i data-lucide="upload" class="w-4 h-4"></i>
                </button>

            </form>
        </div>
    </div>

</div>
{% endblock %}
